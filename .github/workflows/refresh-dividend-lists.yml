name: Refresh dividend lists

# 배당 목록 3종(배당킹·배당귀족·배당챔피언)과 그 파생물을 갱신한다.
#
#   npm run dividend:lists         → dividendLists.generated.json          (멤버십·지표)
#   npm run dividend:metrics       → dividendLists.metrics.generated.json  (목록 종목 배당률·5년 성장률)
#   npm run dividend:hidden-stars  → dividendLists.hiddenStars.generated.json (유니버스에서 규칙 통과분)
#   npm run dividend:dex           → dividendDex.generated.json            (도감 카드 — 번호 append-only)
#
# ## 순서가 있다
# 히든스타와 도감은 **목록의 파생물**이라 목록을 먼저 만들어야 한다. 따로 돌리면 도감이 지난 목록을
# 보고 카드를 만든다. 그래서 한 잡에서 이 순서로 이어 돌린다.
#
# ## 🔴 멤버십이 바뀐 달에는 자동 머지하지 않는다 (그대로인 달은 자동 머지 — 2026-11-06, 아래 단계 주석)
# 멤버십 변화는 **사건**이다 — 배당킹에서 한 종목이 빠지는 것은 50년 연속 증배가 끊겼다는 뜻이고,
# 화면이 사용자에게 그렇게 말하게 된다. 값이 매일 조금씩 움직이는 가격 갱신과 성질이 다르다.
# 또 도감 번호는 append-only 라 잘못 들어간 편입을 되돌려도 번호는 회수되지 않는다(CLI 머리주석).
# 그래서 PR 만 열고 멈춘다 — korea-assembly 와 같은 판단이다.
#
# ⚠ 후보 유니버스(`refresh-dividend-universe.yml`)와는 다른 자료다. 그쪽은 "후보군을 넓히는" 월간
#   갱신이고 자동 머지한다. 이쪽은 그 위에서 **확정 목록**을 만든다.
on:
  schedule:
    # 매월 5일 22:30 UTC == 6일 07:30 KST. 유니버스 갱신(매월 2일)이 끝난 뒤에 돈다 — 순서가 뒤집히면
    # 이번 달 목록이 지난달 유니버스를 보고 만들어진다.
    - cron: '30 22 5 * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit to one list (kings | aristocrats | champions)'
        required: false
        type: string
      delay:
        description: 'Delay between requests in ms (blank = CLI default)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-dividend-lists
  cancel-in-progress: false

env:
  # 🔴 Node 시작 전에 심는다(2026-08-11 회귀 — 자세한 경위는 refresh-paydates.yml 주석).
  TZ: Asia/Seoul
  REFRESH_BRANCH: chore/refresh-dividend-lists
  LISTS_JSON: shared/constants/dividendLists/dividendLists.generated.json
  METRICS_JSON: shared/constants/dividendLists/dividendLists.metrics.generated.json
  HIDDEN_STARS_JSON: shared/constants/dividendLists/dividendLists.hiddenStars.generated.json
  DEX_JSON: shared/constants/dividendDex/dividendDex.generated.json

jobs:
  dividend-lists:
    runs-on: ubuntu-latest
    # 목록 3종 수집은 요청이 많아 지연을 넣고 돈다.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh the lists
        env:
          ONLY: ${{ inputs.only }}
          DELAY: ${{ inputs.delay }}
        run: |
          args="--write"
          if [ -n "$ONLY" ]; then args="$args --only=$ONLY"; fi
          if [ -n "$DELAY" ]; then args="$args --delay=$DELAY"; fi
          npm run dividend:lists -- $args

      # 🔴 목록 화면의 선행 배당률·5년 성장률(`$METRICS_JSON`). 2026-11-05 까지 **이 단계가 없었다** —
      # 아래 `git add` 는 그 파일을 올렸지만 만드는 코드가 없어, 화면이 8월 4일 가격의 배당률에 석 달
      # 멈춰 있었다(근거: scripts/dividendLists/metrics.ts 머리말). 목록 **뒤에** 돈다: 이번 달 귀족
      # 구성으로 재야 한다.
      # ⚠ `continue-on-error` — 야후가 막힌 날 지표만 못 고치고 목록 갱신은 살린다. CLI 는 실패가 10% 를
      #   넘으면 파일을 쓰지 않으므로 지난 생성물이 한 벌로 남는다(반쯤 섞인 파일이 나가지 않는다).
      - name: Re-measure list metrics
        continue-on-error: true
        env:
          DELAY: ${{ inputs.delay }}
        run: |
          args="--write"
          if [ -n "$DELAY" ]; then args="$args --delay=$DELAY"; fi
          npm run dividend:metrics -- $args

      # 파생물 둘 — 위 목록을 입력으로 삼는다. 순서를 바꾸지 마라.
      - name: Rebuild hidden stars
        run: npm run dividend:hidden-stars

      - name: Rebuild the dividend dex
        run: npm run dividend:dex

      # 🔴 **데이터가 바뀌면 `api/*.js` 도 낡는다**(2026-08-12 발견).
      # `api/*.js` 는 커밋되는 배포 산출물이고, 그중 `seo-html`·`og` 번들은 이 데이터를 **품고 있다**.
      # 데이터만 커밋하면 산출물이 소스와 어긋나 `api:check` 가 실패한다 — 실제로 지급일 갱신
      # PR(#127)이 머지된 직후 main 이 그 상태가 됐고, 다음 PR 의 CI 가 그것을 잡았다.
      # ⚠ 바뀐 것이 없으면 아무 파일도 변하지 않는다(멱등) — 조건 없이 돌려도 안전하다.
      - name: Rebundle api outputs
        run: npm run api:bundle

      - name: Typecheck
        run: npx tsc -b tsconfig.build.json

      - name: Test
        run: npm run test:ci

      # 멤버십(목록·히든스타·도감의 종목 구성)이 그대로인지 — 아래 PR 단계가 자동 머지 여부를 이걸로 가른다.
      # 🔴 커밋 **전에** 돈다: HEAD(지난달 생성물)와 작업 트리(방금 만든 것)를 비교한다.
      # ⚠ 요약 파일(membership-summary.md)은 커밋 대상이 아니다 — 아래 커밋은 경로를 지정해 add 한다.
      - name: Detect membership change
        id: membership
        env:
          MEMBERSHIP_SUMMARY: membership-summary.md
        run: npm run dividend:lists:membership

      # 변화 판정에서 **도감을 뒤로 뺀다** — 2차 방어선이다.
      # 도감 생성기는 카드가 그대로면 `asOf` 도 그대로 두도록 고쳤다(2026-08-11, dexCli 주석).
      # 그 전에는 실행할 때마다 날짜를 오늘로 써서, 내용이 안 바뀌어도 diff 가 생겼고 "안 바뀌면
      # PR 을 만들지 않는다"는 가드가 매달 무력했다. 생성기가 다시 그렇게 되더라도 여기서 막힌다.
      - name: Commit the refreshed lists
        id: commit
        run: |
          git add "$LISTS_JSON" "$METRICS_JSON" "$HIDDEN_STARS_JSON" api
          if git diff --cached --quiet; then
            echo "멤버십도 지표도 그대로다 — 이번 달 변화가 없다(도감 날짜만 움직인 것은 되돌린다)."
            git checkout -- "$DEX_JSON"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add "$DEX_JSON"
          git push origin --delete "$REFRESH_BRANCH" 2>/dev/null || true
          git checkout -B "$REFRESH_BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(data): 배당 목록·히든스타·도감 갱신"
          # GitHub 쪽 일시 오류(2026-10-06 `index-pack failed`)로 push 한 번이 거부되면
          # 월간 갱신은 한 달치를 통째로 잃는다 — 간격을 두고 3회까지 다시 민다.
          for i in 1 2 3; do
            git push origin "$REFRESH_BRANCH" && break
            [ "$i" -eq 3 ] && exit 1
            echo "push 실패(${i}/3) — $((i * 30))초 뒤 재시도"; sleep $((i * 30))
          done
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # 🔴 멤버십이 그대로면 자동 머지한다(2026-11-06). 바뀐 달에만 PR 을 열고 멈춘다.
      #
      # 종전에는 **항상** 멈췄다. 그때는 이 워크플로가 멤버십만 다뤘으니 맞았다. 2026-11-05 부터 매달
      # 배당률도 다시 재므로 멤버십이 그대로인 달에도 PR 이 열리고, 머지하지 않으면 배당률이 다시 멈춘다
      # (근거: scripts/dividendLists/listsChange.ts 머리말). 값만 바뀐 달은 다른 갱신 워크플로와 같이 다룬다.
      # ⚠ 판정을 못 하면(파일을 못 읽으면) 판정기가 "변화 있음"을 낸다 — 모르면 사람에게 넘긴다.
      - name: Auto-merge when membership is unchanged
        if: steps.commit.outputs.committed == 'true' && steps.membership.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '배당 목록 지표(선행 배당률 · 5년 성장률)와 날짜를 다시 만들었습니다.'
            echo
            echo '**멤버십 변화 없음** — 목록·히든스타·도감의 종목 구성이 지난달과 같아 자동 머지합니다.'
            echo '갱신 잡이 커밋 전에 `api:bundle` · `tsc -b tsconfig.build.json` · `test:ci` 를 통과했습니다.'
          } > pr-body.md
          title="chore(data): 배당 목록 지표 갱신 (멤버십 변화 없음)"
          if gh pr view "$REFRESH_BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$REFRESH_BRANCH" --title "$title" --body-file pr-body.md
          else
            gh pr create --base main --head "$REFRESH_BRANCH" --title "$title" --body-file pr-body.md
          fi
          # ⚠ 이 PR 로 시작되는 ci.yml 실행은 "작업 0개 실패"로 남는다 — 봇이 만든 PR 의 실행은 승인 대기에서
          #   시작하지 못하고, 아래 --delete-branch 로 브랜치가 사라지면 실패로 닫힌다. 대기를 넣어도 안 고쳐진다
          #   (2026-11-07 실측, `sleep 30` 을 넣었다 뺐다). 검증은 이 잡 안에서 이미 끝났다 — CLAUDE.md "CI 빨간 PR".
          gh pr merge "$REFRESH_BRANCH" --merge --delete-branch

      # PR 만 연다. 🔴 자동 머지하지 않는다 — 멤버십 변화는 사람이 봐야 하는 사건이다.
      - name: Open the PR for review
        if: steps.commit.outputs.committed == 'true' && steps.membership.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '배당 목록 3종과 파생물(히든스타 · 도감)을 다시 만들었습니다.'
            echo
            echo '### 바뀐 멤버십'
            cat membership-summary.md 2>/dev/null || echo '- (요약을 만들지 못했다 — diff 를 직접 본다)'
            echo
            echo '### 🔴 사람이 봐야 하는 이유'
            echo '- **멤버십 변화는 사건입니다.** 배당킹에서 종목이 빠지면 50년 연속 증배가 끊겼다는 뜻이고, 화면이 사용자에게 그렇게 말하게 됩니다. 편입·제외 목록이 상식적인지 확인해 주세요.'
            echo '- **도감 번호는 append-only 입니다.** 잘못 들어간 편입을 나중에 되돌려도 번호는 회수되지 않습니다 — 빈 번호가 남습니다.'
            echo
            echo '### 확인 순서'
            echo '1. 편입·제외된 종목이 실제로 그 조건을 넘었는지(연속 증배 연수)'
            echo '2. 수집 실패로 지표가 통째로 빠진 종목이 없는지'
            echo '3. 도감에 새로 붙은 번호가 목록 끝에 이어졌는지'
          } > pr-body.md
          title="chore(data): 배당 목록·히든스타·도감 갱신 (사람 확인 필요)"
          if gh pr view "$REFRESH_BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$REFRESH_BRANCH" --title "$title" --body-file pr-body.md
          else
            gh pr create --base main --head "$REFRESH_BRANCH" --title "$title" --body-file pr-body.md
          fi
          echo "::notice::PR 을 열었다. 🔴 자동 머지하지 않는다 — 멤버십 변화는 사람이 확인한다."
