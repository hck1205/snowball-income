# AI 리포터 ① — 다음 회차 **사실 준비** (2026-11-10)
#
# 비용 설계(사용자 요구 "프로그램으로 최대한 비용을 줄인다"): 숫자·표·차트는 전부 여기서 스크립트로 만든다.
# 루틴(LLM)은 이 파일이 남긴 `next-facts.json` 하나만 읽고 제목·짧은 본문만 쓴다 — 저장소를 뒤지거나
# npm install 을 하지 않아 실행이 짧다.
#
# 흐름: 월·수·목·토 04:17 KST(이 파일) → 10:00 루틴이 초안을 `ai-reporter` 브랜치 inbox 에 push →
#       `ai-reporter-publish.yml`(2시간마다 대기함 확인)이 검사·발행.
# 월·목은 게시판 글(주제 순환), **수요일은 파이어족들 영상 글**(fire-video, 2026-11-11),
# **토요일은 배당 계산 갤러리 글**(gallery-portfolio, 2026-11-10).
#
# 🔴 코드는 main 에서, 데이터(대장·초안)는 `ai-reporter` 브랜치에서. 그 브랜치에는 글 파일만 있다.
# 새로 쓸 사실이 없으면(같은 회차를 이미 다뤘으면) 아무것도 올리지 않는다 — 루틴도 할 일 없이 끝난다.
name: AI reporter - prepare facts

on:
  schedule:
    # 🔴 04:17 KST(2026-11-12) — 루틴(10:00 KST)보다 6시간 앞선다. 07:00 예약이 11:45 에 돈 날이 있었다
    # (GitHub 예약 지연). 정각을 피한 분(:17)은 정각 몰림을 덜 탄다.
    - cron: '17 19 * * 0,3' # 일·수 19:17 UTC = 월·목 04:17 KST — 게시판
    - cron: '17 19 * * 2' # 화 19:17 UTC = 수 04:17 KST — 파이어족들 영상
    - cron: '17 19 * * 5' # 금 19:17 UTC = 토 04:17 KST — 갤러리
  workflow_dispatch:
    inputs:
      topic:
        description: 'week-ahead | income-target | ticker-spotlight | gallery-portfolio | fire-video (비우면 순환)'
        required: false
        default: ''

# 최상위 env — Node 시작 전에 KST 로 고정한다(날짜 계산이 KST 기준이어야 한다. refreshFailureAlerting 계약).
env:
  TZ: Asia/Seoul

permissions:
  contents: write

concurrency:
  group: ai-reporter
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout reporter branch (data)
        run: |
          git fetch origin ai-reporter
          git worktree add reporter origin/ai-reporter
          git -C reporter checkout -B ai-reporter

      - name: Build next facts
        id: facts
        env:
          TOPIC: ${{ inputs.topic }}
          # 파이어족들 영상 중복 확인용(공개 글 읽기만). 공개 키라 비밀이 아니지만 저장소 값을 쓴다.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 파이어족들 영상 — 공식 API 키. GitHub(데이터센터 IP)에서는 RSS·영상 페이지가 막혀 API 만 확실히 된다.
          # 없으면 RSS → 채널 페이지 순서로 시도한다(대부분 실패하므로 키 등록이 전제).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          args="--ledger reporter/content/ai-reporter/ledger.json"
          # 토요일(KST, 최상위 TZ) 정기 실행은 갤러리 글이다. 수동 실행은 입력한 주제를 따른다.
          if [ -z "$TOPIC" ] && [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" = "6" ]; then TOPIC=gallery-portfolio; fi
          if [ -z "$TOPIC" ] && [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" = "3" ]; then TOPIC=fire-video; fi
          if [ -n "$TOPIC" ]; then args="$args --topic $TOPIC"; fi
          npm run reporter --silent -- facts $args > facts.json
          # CLI 는 한 줄 JSON(`{"skip":true,…}`)을 낸다 — 공백 유무와 무관하게 잡는다(2026-11-11: 공백 있는
          # 패턴만 찾다가 건너뜀 결과를 next-facts.json 으로 커밋한 적이 있다).
          if grep -Eq '"skip": *true' facts.json; then
            echo "새로 쓸 사실이 없다 — 이번 회차는 건너뛴다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit next-facts.json
        if: steps.facts.outputs.skip != 'true'
        run: |
          cp facts.json reporter/content/ai-reporter/next-facts.json
          rm -f reporter/content/ai-reporter/last-error.json
          cd reporter
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ai-reporter
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "chore(ai-reporter): next facts $(node -e "console.log(require('./content/ai-reporter/next-facts.json').factKey)")"
          git push origin HEAD:ai-reporter
