# AI 리포터 ① — 다음 회차 **사실 준비** (2026-11-10)
#
# 비용 설계(사용자 요구 "프로그램으로 최대한 비용을 줄인다"): 숫자·표·차트는 전부 여기서 스크립트로 만든다.
# 루틴(LLM)은 이 파일이 남긴 `next-facts.json` 하나만 읽고 제목·짧은 본문만 쓴다 — 저장소를 뒤지거나
# npm install 을 하지 않아 실행이 짧다.
#
# 흐름: 월·목 07:00 KST(이 파일) → 08:00 루틴이 초안을 `ai-reporter` 브랜치 inbox 에 push →
#       09:30 `ai-reporter-publish.yml` 이 검사·발행.
#
# 🔴 코드는 main 에서, 데이터(대장·초안)는 `ai-reporter` 브랜치에서. 그 브랜치에는 글 파일만 있다.
# 새로 쓸 사실이 없으면(같은 회차를 이미 다뤘으면) 아무것도 올리지 않는다 — 루틴도 할 일 없이 끝난다.
name: AI reporter - prepare facts

on:
  schedule:
    - cron: '0 22 * * 0,3' # 일·수 22:00 UTC = 월·목 07:00 KST
  workflow_dispatch:
    inputs:
      topic:
        description: 'week-ahead | income-target | ticker-spotlight (비우면 순환)'
        required: false
        default: ''

# 최상위 env — Node 시작 전에 KST 로 고정한다(날짜 계산이 KST 기준이어야 한다. refreshFailureAlerting 계약).
env:
  TZ: Asia/Seoul

permissions:
  contents: write

concurrency:
  group: ai-reporter
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout reporter branch (data)
        run: |
          git fetch origin ai-reporter
          git worktree add reporter origin/ai-reporter
          git -C reporter checkout -B ai-reporter

      - name: Build next facts
        id: facts
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          args="--ledger reporter/content/ai-reporter/ledger.json"
          if [ -n "$TOPIC" ]; then args="$args --topic $TOPIC"; fi
          npm run -s reporter -- facts $args > facts.json
          if grep -q '"skip": true' facts.json; then
            echo "새로 쓸 사실이 없다 — 이번 회차는 건너뛴다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit next-facts.json
        if: steps.facts.outputs.skip != 'true'
        run: |
          cp facts.json reporter/content/ai-reporter/next-facts.json
          rm -f reporter/content/ai-reporter/last-error.json
          cd reporter
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ai-reporter
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "chore(ai-reporter): next facts $(node -e "console.log(require('./content/ai-reporter/next-facts.json').factKey)")"
          git push origin HEAD:ai-reporter
