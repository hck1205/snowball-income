name: AI reporter - market candidates

# 시장 기사(화·금) 주제 후보를 **코드로** 만든다(2026-11-24).
# 우리 종목 페이지가 있는 종목(레버리지 ETF 제외)의 최근 사흘 일봉에서 큰 등락(±4% 이상)을 골라
# ai-reporter 브랜치의 content/ai-reporter/market-candidates.json 에 남긴다. 루틴(LLM)은 이 후보 중 하나를
# 골라 "왜 움직였나"를 취재해 쓰고, 등락률은 여기 값을 그대로 옮긴다 — 찾기·계산을 LLM 에 맡기지 않는다.
# 판정 로직은 scripts/aiReporter/marketNews.ts(pickMoveCandidates, 테스트로 잠김).
#
# 시각: 화·금 04:47 KST(월·목 19:47 UTC). 루틴은 그 뒤(화·금 07:07 KST)에 돈다.
# (2026-11-25: 첫 머지 때 GitHub 504 로 워크플로 등록이 빠져, 이 줄을 더한 푸시로 다시 등록했다.)
on:
  schedule:
    - cron: '47 19 * * 1,4'
  workflow_dispatch:

env:
  TZ: Asia/Seoul

permissions:
  contents: write

# 다른 AI 리포터 워크플로와 같은 브랜치에 push 한다 — 겹치면 한쪽 push 가 거절된다.
concurrency:
  group: ai-reporter
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout reporter branch (data)
        run: |
          git fetch origin ai-reporter
          git worktree add reporter origin/ai-reporter
          git -C reporter checkout -B ai-reporter

      - name: Build candidates
        run: npm run reporter --silent -- market-candidates --ledger reporter/content/ai-reporter/ledger.json > candidates.json

      - name: Commit market-candidates.json
        run: |
          cp candidates.json reporter/content/ai-reporter/market-candidates.json
          cd reporter
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ai-reporter/market-candidates.json
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "chore(ai-reporter): market candidates $(date +%F)"
          for attempt in 1 2 3; do
            git push origin HEAD:ai-reporter && exit 0
            git pull --rebase origin ai-reporter
          done
          exit 1
