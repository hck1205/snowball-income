name: Refresh 13F snapshots

# SEC 13F 기반 스냅샷 둘을 함께 갱신한다 — **대가 보유**(`shared/constants/investors/`)와
# **국민연금 미국 주식**(`shared/constants/npsPortfolio/`).
#
# ## 왜 한 워크플로에 묶나
# 둘 다 같은 원자료(SEC EDGAR 13F)를 같은 방식으로 읽고, 같은 분기 리듬(2·5·8·11월 중순 마감)에
# 함께 바뀐다. 워크플로를 나누면 같은 날 두 개의 PR 이 열려 리뷰 대상만 늘어난다.
#
# ## 왜 매일 도는가 — 분기 자료인데
# 두 수집기 모두 **"매일 확인하고, 바뀔 때만 갱신한다"** 로 설계돼 있다(각 CLI 머리주석).
# 접수번호를 비교해 달라진 것만 받으므로 평소 요청이 십수 건이고, 실제 갱신은 마감 주간에만 몰린다.
# 분기 날짜를 크론에 박으면 제출이 하루만 밀려도 그 분기를 통째로 놓친다 — korea-assembly 가
# "3~9월 매일"을 고른 것과 같은 이유다.
#
# ## 자동 머지한다
# 분기마다 값이 바뀌는 것이 **정상 동작**이고 사람이 판단할 여지가 없다(공시를 그대로 옮긴다).
# paydates·tickers 와 같은 부류다. 표 전체가 한꺼번에 바뀌는 사건형 갱신(korea-assembly)만 PR 로 멈춘다.
on:
  schedule:
    # 매일 23:00 UTC == 다음 날 08:00 KST. 다른 갱신 워크플로와 시각이 겹치지 않게 두었다.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-collect everyone even if the accession number is unchanged (parser fixes)'
        required: false
        default: false
        type: boolean
      auto_merge:
        description: 'Merge the PR automatically'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-13f
  cancel-in-progress: false

env:
  # 🔴 Node 시작 전에 심는다 — V8 은 첫 Date 사용 시점에 타임존을 캐시하므로 프로세스가 뜬 뒤
  #    바꾼 값(vitest.config 의 env.TZ)은 Date/Intl 에 반영되지 않는다(2026-08-11 회귀).
  TZ: Asia/Seoul
  REFRESH_BRANCH: chore/refresh-13f
  INVESTORS_JSON: shared/constants/investors/investorHoldings.generated.json
  NPS_JSON: shared/constants/npsPortfolio/npsPortfolio.generated.json

jobs:
  refresh-13f:
    runs-on: ubuntu-latest
    # 마감 주간에는 인물 13명분 파일을 새로 받는다. 평소에는 몇 분 안에 끝난다.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 두 수집기 모두 **실패해도 기존 스냅샷을 망가뜨리지 않는다**(각 CLI 머리주석). 그래서 한쪽이
      # 실패해도 다른 쪽 결과는 살린다 — `|| true` 가 아니라 종료코드를 모아 마지막에 판정한다.
      - name: Collect investor 13F holdings
        id: investors
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=""
          if [ "$FORCE" = "true" ]; then args="--force"; fi
          npm run investors:holdings -- $args

      - name: Collect National Pension Service 13F
        run: npm run nps:portfolio

      - name: Typecheck
        # 전체(app + scripts + api). bare `tsc -b` 는 루트만 본다.
        run: npx tsc -b tsconfig.build.json

      - name: Test
        run: npm run test:ci

      # 바뀐 것이 없는 날(대부분)은 빈 커밋도 빈 PR 도 만들지 않는다.
      - name: Commit the refreshed snapshots
        id: commit
        run: |
          git add "$INVESTORS_JSON" "$NPS_JSON"
          if git diff --cached --quiet; then
            echo "13F 접수번호가 그대로다 — 새 제출이 없다."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin --delete "$REFRESH_BRANCH" 2>/dev/null || true
          git checkout -B "$REFRESH_BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(data): 13F 스냅샷 갱신 (대가 보유 · 국민연금)"
          git push origin "$REFRESH_BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Open and auto-merge the 13F PR
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_MERGE: ${{ github.event_name == 'schedule' || inputs.auto_merge }}
        run: |
          if ! gh pr view "$REFRESH_BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            {
              echo 'SEC EDGAR 13F 에서 새 제출을 발견해 스냅샷을 갱신했습니다.'
              echo
              echo '- `shared/constants/investors/` — 대가 보유'
              echo '- `shared/constants/npsPortfolio/` — 국민연금 미국 주식'
              echo
              echo '### 이 자료의 성질'
              echo '13F 는 **분기말 기준 보유**이고 제출은 그로부터 최대 45일 뒤입니다. 화면이 보는 시점에는 이미 지난 자료이며, 공매도·채권·해외주식은 담기지 않습니다. 그 사실은 각 화면이 직접 말합니다.'
              echo
              echo '### 왜 자동 머지인가'
              echo '공시를 그대로 옮기는 기계적 갱신이라 사람이 판단할 여지가 없습니다. 수집기는 실패해도 기존 스냅샷을 덮지 않으므로, 이 PR 이 열렸다는 것은 새 제출을 정상적으로 읽었다는 뜻입니다.'
            } > pr-body.md
            gh pr create --base main --head "$REFRESH_BRANCH" \
              --title "chore(data): 13F 스냅샷 갱신 (대가 보유 · 국민연금)" \
              --body-file pr-body.md
          fi
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$REFRESH_BRANCH" --merge --delete-branch
          else
            echo "auto_merge=false - PR 을 열어 두고 멈춘다."
          fi
