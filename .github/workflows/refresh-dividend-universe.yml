name: Refresh dividend candidate universe

# 매월, 배당 연속증배 ETF 4종(NOBL 25년+ · SDY 20년+ · REGL 15년+ · SMDV 10년+)의 보유내역을 다시 받아
# `shared/constants/dividendLists/dividendLists.universe.generated.json` 을 갱신한다.
# 종목마다 야후 chart 를 한 번 불러 현재가·선행 배당률·5년 배당성장률을 뽑고, 수집기가 그 자리에서 스스로
# 검산한다(`npm run dividend:universe`).
#
# ## 왜 매월 2일(UTC)인가
# ① 지수 재구성이 1월에 몰려 있어 월초에 받는 것이 실제 편출입을 가장 빨리 반영한다.
# ② 기존 `refresh-tickers.yml`(매월 1일 21:00 UTC)과 **하루 어긋내** 두 PR 이 같은 날 겹치지 않게 한다.
# ③ 시각을 20:00 UTC 로 둔 것은 매일 도는 `refresh-paydates.yml`(21:30 UTC)보다 먼저 끝나기 위해서다 —
#    이 워크플로는 야후를 262회 부르느라 10분 안팎이 걸리고 재시도까지 하면 더 길어진다.
# (20:00 UTC = 한국 시간 다음 날 05:00)
#
# ## 🔴 이 워크플로의 핵심: 멤버십이 바뀌면 자동 머지를 막는다
# - 필드만 바뀌면(가격·배당률·성장률·섹터) → 예약 실행은 그대로 자동 머지한다. 매달 반드시 바뀌는 값이고
#   사람이 볼 것이 없다.
# - 종목이 추가·삭제되거나 편입 ETF 가 바뀌면 → **PR 만 열고 멈춘다.** 종목이 빠졌다는 것은 배당 삭감이나
#   지수 탈락을 뜻하고, 그건 사람이 봐야 한다. 이 레포가 목록을 DB 가 아니라 커밋되는 JSON 에 둔 이유가
#   정확히 그것이다.
# 감지는 셸이 아니라 `scripts/dividendLists/membershipDiff.ts`(순수 함수 + 단위 테스트)가 한다 —
# 워크플로는 실제로 돌려 보기 전에는 검증할 수 없으므로, 판정 규칙을 YAML 안에 두면 아무도 못 고친다.
on:
  schedule:
    # 매월 2일 20:00 UTC == 3일 05:00 KST.
    - cron: '0 20 2 * *'
  workflow_dispatch:
    # ⚠ 수집기(`dividend:universe`)에는 티커를 골라 받는 `--only` 가 없다 — 후보 유니버스는 "ETF 가 지금
    # 들고 있는 종목 전체"라서 일부만 받으면 그 결과는 유니버스가 아니다(빠진 종목이 전부 '제외'로 보인다).
    # 그래서 부분 실행 손잡이는 `--limit` 하나뿐이고, 그 실행은 **생성물을 쓰지도 PR 을 열지도 않는다**.
    inputs:
      limit:
        description: 'Smoke test: collect only the first N candidates (writes nothing, opens no PR)'
        required: false
        type: string
      delay:
        description: 'Milliseconds between Yahoo requests (blank = 1200)'
        required: false
        type: string
      auto_merge:
        description: 'Auto-merge the PR to main (= deploy). Ignored when membership changed.'
        required: false
        default: true
        type: boolean

# The job pushes a refresh branch, opens a PR, and merges it only when nothing but fields changed.
permissions:
  contents: write
  pull-requests: write

# 262회의 야후 호출이 두 겹으로 도는 일을 막는다(수동 실행과 예약 실행이 겹칠 수 있다).
concurrency:
  group: refresh-dividend-universe
  cancel-in-progress: false

# ⚠ 여기(워크플로 수준 env)에서는 `runner` 컨텍스트를 쓸 수 없다 — 러너 임시 경로가 필요한 값은
# 스텝 수준 env 로 내려 두었다(`${{ runner.temp }}` 는 스텝 env 에서만 유효하다).
env:
  # 🔴 Node **시작 전에** 심어야 하는 값이다(2026-08-11). V8 은 첫 Date 사용 시점에 타임존을
  #    캐시하므로, vitest.config 의 `env.TZ` 처럼 프로세스가 뜬 뒤 넣은 값은 Date/Intl 에 반영되지
  #    않는다. 그래서 `process.env.TZ` 는 'Asia/Seoul' 인데 `getHours()` 는 UTC 로 읽히는 상태가 됐고,
  #    이 잡이 2026-08-09 부터 테스트 단계에서 멈췄다(로컬은 PC 가 KST 라 우연히 통과했다).
  # ⚠ 이 앱의 날짜 계산(배당 지급일·'오늘' 판정)은 KST 기준이다 — 러너 기본값(UTC)으로 돌리면
  #   하루 어긋난 데이터를 그대로 커밋하게 된다.
  TZ: Asia/Seoul
  UNIVERSE_JSON: shared/constants/dividendLists/dividendLists.universe.generated.json

jobs:
  universe:
    runs-on: ubuntu-latest
    # 최악의 경우(3회 재시도 + 사이 대기 + 타입체크 + 전체 테스트)를 넉넉히 덮는다.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 비교 기준본은 **직전 커밋의 생성물**이다. 작업트리 파일은 곧 덮어써지므로 미리 꺼내 둔다.
      # 파일이 아직 커밋된 적 없으면(파이프라인 첫 실행) 기준본 없이 진행하고, 그 경우 판정은 "막는다"다.
      - name: Save the committed universe as the comparison baseline
        env:
          BASELINE_JSON: ${{ runner.temp }}/universe-base.json
        run: |
          if git cat-file -e "HEAD:$UNIVERSE_JSON" 2>/dev/null; then
            git show "HEAD:$UNIVERSE_JSON" > "$BASELINE_JSON"
            echo "기준본 확보: $(wc -c < "$BASELINE_JSON") bytes"
          else
            echo "::warning::직전 커밋에 $UNIVERSE_JSON 이 없다(첫 실행) — 비교 기준이 없으므로 자동 머지를 막는다."
          fi

      # 입력은 셸에 보간하지 않고 env 로 넘긴다(수동 입력이 셸을 주입할 수 없게).
      #
      # 비용: 후보 262종 × 야후 chart 1회 = 약 16MB. `--delay=1200` 이면 대기만 5분, 총 6~7분이다.
      # 수집기는 종목 하나의 실패를 던지지 않고 `fetchFailed` 신고로 접는다(한 종목 때문에 260종을 잃지
      # 않기 위해서다). 그래서 **전면 차단을 워크플로가 따로 봐야 한다** — 그 판정은
      # `dividend:universe:diff` 가 하고, 종료코드 3(=대량 조회 실패)이면 커밋하지 않고 다시 받는다.
      #
      # 재시도 정책: 최대 3회. 소스 수집 실패(종료코드 1)와 대량 조회 실패(가드 종료코드 3)만 재시도하고,
      # 재시도 전에 반쯤 쓰인 생성물을 되돌린다. 요청 간격은 2배씩(최대 3000ms), 시도 사이는 2분→4분 쉰다.
      # 🔴 수집기 종료코드 2 는 "썼지만 사람이 봐야 할 신고가 있다"라서 실패가 아니다 — 2026-08-04 실측에서
      # 5건(FCPT·STAG·RLI·WRB·MBGL)이 상시로 떠 있다. 2를 실패로 다루면 이 크론은 매달 그냥 죽는다.
      - name: Collect the candidate universe
        id: collect
        env:
          DELAY: ${{ inputs.delay || '1200' }}
          LIMIT: ${{ inputs.limit }}
          MAX_ATTEMPTS: '3'
          BASELINE_JSON: ${{ runner.temp }}/universe-base.json
          PR_BODY: ${{ runner.temp }}/universe-pr-body.md
        run: |
          if [ -n "$LIMIT" ]; then
            echo "부분 실행(--limit=$LIMIT) — 생성물을 쓰지 않고 수집기 동작만 확인한다. PR 도 열지 않는다."
            code=0
            npm run dividend:universe -- --limit="$LIMIT" --delay="$DELAY" || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
            echo "partial=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          attempt=1
          delay="$DELAY"
          backoff=120
          while :; do
            echo "::group::수집 시도 $attempt/$MAX_ATTEMPTS (요청 간격 ${delay}ms)"
            collect_code=0
            npm run dividend:universe -- --write --delay="$delay" || collect_code=$?
            echo "::endgroup::"

            if [ "$collect_code" -eq 0 ] || [ "$collect_code" -eq 2 ]; then
              base_arg=""
              if [ -s "$BASELINE_JSON" ]; then base_arg="--base=$BASELINE_JSON"; fi
              guard_code=0
              npm run dividend:universe:diff -- $base_arg --summary="$PR_BODY" --github-output || guard_code=$?
              if [ "$guard_code" -eq 0 ]; then
                break
              fi
              if [ "$guard_code" -ne 3 ]; then
                echo "::error::구성 비교가 실패했다(종료코드 $guard_code). 커밋하지 않는다."
                exit 1
              fi
            fi

            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::$MAX_ATTEMPTS 번 시도했지만 믿을 만한 수집본을 못 얻었다. 커밋하지 않는다 — 기존 생성물이 그대로 남는다."
              exit 1
            fi
            git checkout -- "$UNIVERSE_JSON" 2>/dev/null || rm -f "$UNIVERSE_JSON"
            echo "${backoff}초 쉬었다가 다시 받는다."
            sleep "$backoff"
            attempt=$((attempt + 1))
            backoff=$((backoff * 2))
            delay=$((delay * 2))
            if [ "$delay" -gt 3000 ]; then delay=3000; fi
          done

      # 🔴 **데이터가 바뀌면 `api/*.js` 도 낡는다**(2026-08-12 발견).
      # `api/*.js` 는 커밋되는 배포 산출물이고, 그중 `seo-html`·`og` 번들은 이 데이터를 **품고 있다**.
      # 데이터만 커밋하면 산출물이 소스와 어긋나 `api:check` 가 실패한다 — 실제로 지급일 갱신
      # PR(#127)이 머지된 직후 main 이 그 상태가 됐고, 다음 PR 의 CI 가 그것을 잡았다.
      # ⚠ 바뀐 것이 없으면 아무 파일도 변하지 않는다(멱등) — 조건 없이 돌려도 안전하다.
      - name: Rebundle api outputs
        run: npm run api:bundle

      - name: Typecheck
        # Full project (app + scripts + api). Bare `tsc -b` only covers the root (api + middleware).
        run: npx tsc -b tsconfig.build.json

      # NOTE: `test:ci` excludes test/snowball/SnowballApp.test.tsx (broken on main for unrelated
      # reasons). Everything else must pass, so a broken collector still fails this gate.
      - name: Test
        run: npm run test:ci

      # 아무것도 안 바뀐 달(가격까지 동일한 경우)에 빈 커밋·빈 PR 을 만들지 않는다.
      #
      # 🔴 브랜치를 **월별로 나눈다**(`...-2026-08`). 형제 워크플로처럼 브랜치 하나를 지웠다 다시 만들면,
      # 멤버십 변화로 열어 둔 지난달 PR 을 사람이 보기 전에 다음 달 실행이 지워 버린다(브랜치가 사라지면
      # GitHub 이 PR 을 닫는다). 이 워크플로는 "사람이 봐야 하는 PR" 이 정상 경로라서 그러면 안 된다.
      # 같은 달에 다시 돌리면 같은 브랜치를 force-push 해 열려 있는 PR 을 갱신한다.
      - name: Commit the refreshed universe
        id: commit
        if: steps.collect.outputs.partial != 'true'
        run: |
          branch="chore/refresh-dividend-universe-$(date -u +%Y-%m)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git add "$UNIVERSE_JSON" api
          if git diff --cached --quiet; then
            echo "바뀐 값이 없다 — 커밋하지 않는다."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$branch"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(data): 월간 배당 후보 유니버스를 갱신한다"
          git push --force origin "$branch"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # PR 은 항상 연다. 머지는 ① 예약 실행이거나 수동으로 auto_merge 를 켰고 ② 구성이 그대로일 때만 한다.
      # 🔴 auto_merge 입력은 "구성이 그대로면 머지해도 좋다"는 뜻이지 멤버십 판정을 무르는 스위치가 아니다.
      - name: Open the PR, and merge it only when fields changed
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          AUTO_MERGE_REQUESTED: ${{ github.event_name == 'schedule' || inputs.auto_merge }}
          BLOCKED: ${{ steps.collect.outputs.blocked }}
          BLOCK_REASON: ${{ steps.collect.outputs.block_reason }}
          PR_BODY: ${{ runner.temp }}/universe-pr-body.md
        run: |
          title="chore(data): 월간 배당 후보 유니버스 갱신"
          if [ "$BLOCKED" != "false" ]; then
            title="$title (구성 변화 — 사람 확인 필요)"
          fi
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$PR_BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$PR_BODY"
          fi
          if [ "$AUTO_MERGE_REQUESTED" != "true" ]; then
            echo "auto_merge=false — PR 만 열고 멈춘다."
            exit 0
          fi
          if [ "$BLOCKED" != "false" ]; then
            echo "::warning::종목 구성이 바뀌었다 — 자동 머지하지 않는다: $BLOCK_REASON"
            exit 0
          fi
          gh pr merge "$BRANCH" --merge --delete-branch
