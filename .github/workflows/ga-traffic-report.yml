name: GA traffic report

# GA 트래픽 → 텔레그램 (2026-11-13). 매일 아침 9시(한국시간) 어제 숫자를 보고:
#   - 매일 어제 일일 리포트(2026-11-14 사용자 요청 — 전에는 급증한 날만).
#   - 참여 세션이 급증했으면(평소의 2배 이상 · 10 이상) 그 앞에 짧은 급증 알림을 따로 한 통 더.
#   - 한국시간 월요일이면 주간 요약도.
# 판정 · 문구는 `scripts/gaReport/trafficReport.ts`(순수 함수, 테스트로 잠김), 호출은 `cli.ts`.
#
# 🔴 저장소가 **공개**라 이 실행 로그도 공개다. 숫자는 텔레그램으로만 보내고 로그에는 "보냈다/안 보냈다"만
#   남긴다. 리포트를 이슈로 열지 않는 이유도 같다(이슈도 공개).
#
# 비밀값(Settings → Secrets and variables → Actions): HUNGRY_HIPPO_GA_SERVICE_ACCOUNT_KEY(→ GA_SERVICE_ACCOUNT_KEY) · GA_PROPERTY_ID(없으면 524806850 — 속성 ID 는 비밀이 아니다) ·
# HUNGRY_HIPPO_BOT_TOKEN(→ 스크립트의 TELEGRAM_BOT_TOKEN) · HUNGRY_HIPPO_TELEGRAM_CHAT_ID(→ TELEGRAM_CHAT_ID). 없으면 스크립트가 건너뛰고 성공으로 끝난다.
# 등록 후 Actions 탭에서 이 워크플로를 수동 실행(mode=test)하면 연결 확인 메시지가 온다.
#
# GA 는 어제 데이터를 다음 날까지 조금씩 보정한다 — 아침 9시 숫자는 최종보다 약간 적을 수 있다.
#
# ⏰ 09:00 에 맞추는 방법(2026-11-24): 처음엔 `0 0 * * *`(= 09:00 KST)로 예약했는데 실제 실행은 매일
#   12:15~16:09 KST 였다(3~7시간 지연, 11/15~11/24 실측). GitHub 예약은 시각을 보장하지 않고, UTC 정각은
#   전 세계 예약이 몰려 특히 많이 밀린다. 그래서 **붐비지 않는 새벽(06:13 KST)에 일찍 깨워 두고 09:00 까지
#   기다렸다 보낸다.** 9시를 넘겨 깨어나면 기다리지 않고 바로 보낸다. 공개 저장소라 기다리는 시간은 무료다.
on:
  schedule:
    - cron: '13 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto(일일 리포트·급증 알림·월요일 주간) · daily(일일 리포트만) · weekly(주간 요약) · test(연결 확인)'
        required: true
        default: test
        type: choice
        options: [test, daily, weekly, auto]

permissions:
  contents: read

concurrency:
  group: ga-traffic-report
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  report:
    runs-on: ubuntu-latest
    # 일찍 깨어나 09:00 까지 기다리는 시간(최대 약 3시간) + 발송.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # 예약 실행만 기다린다(수동 실행은 바로 보낸다). TZ=Asia/Seoul 이라 '09:00' 은 오늘 09:00 KST 다.
      - name: Wait until 09:00 KST
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(date -d '09:00' +%s)
          if [ "$now" -lt "$target" ]; then
            echo "09:00 KST 까지 $(( (target - now) / 60 ))분 기다린다."
            sleep $(( target - now ))
          else
            echo "이미 09:00 KST 가 지났다 — 바로 보낸다."
          fi

      - name: Send report
        env:
          REPORT_MODE: ${{ inputs.mode || 'auto' }}
          GA_SERVICE_ACCOUNT_KEY: ${{ secrets.HUNGRY_HIPPO_GA_SERVICE_ACCOUNT_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID || secrets.HUNGRY_HIPPO_GA_PROPERTY_ID || '524806850' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.HUNGRY_HIPPO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HUNGRY_HIPPO_TELEGRAM_CHAT_ID }}
        run: npm run ga:report
