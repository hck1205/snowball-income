name: Notify data refresh failure

# 🔴 자동화의 마지막 구멍을 막는다 — **돌아가는 것은 자동인데, 안 돌아갈 때 조용하다.**
#
# 2026-08-12 에 발견한 사실: 배당 지급일 갱신이 8/9 부터, 한국 의원 갱신이 8/7 부터 멈춰 있었는데
# **나흘간 아무도 몰랐다.** 데이터 신선도를 우연히 훑어보다 드러났다. 화면에는 아무 증상이 없다 —
# 갱신이 안 됐을 뿐이라 앱은 어제 데이터로 멀쩡히 그려진다. 그래서 "고장났다"는 신호를 만들지 않으면
# 다음에도 똑같이 며칠을 잃는다.
#
# GitHub 이 스케줄 실패 메일을 보내기는 하지만 **레포 소유자 앞으로만** 가고 다른 알림에 묻힌다.
# 이슈는 레포에 남고, 열려 있는 동안 계속 보인다.
#
# ## 왜 각 워크플로 안의 `if: failure()` 단계가 아니라 별도 워크플로인가
#   1. **잡이 통째로 죽는 경우를 잡는다.** `if: failure()` 단계는 같은 잡 안에 있어서, 러너가 죽거나
#      `actions/checkout` 이 실패하거나 잡이 타임아웃되면 그 단계도 함께 못 돈다. `workflow_run` 은
#      바깥에서 결과만 보므로 그런 경우에도 뜬다.
#   2. **한 곳에서 고친다.** 알림 문구·중복 정책을 9개 파일에 복사하면 곧 서로 어긋난다.
#
# ⚠ 대신 이 방식의 약점은 **목록에서 빠뜨리면 조용히 안 온다**는 것이다. 새 `refresh-*` 워크플로를
#   만들고 아래 `workflows:` 에 이름을 안 적으면 그 파이프라인만 알림망 밖에 있게 된다 —
#   이 레포가 반복해서 밟은 바로 그 함정("규칙이 자기 자신을 무효화한다")과 같은 모양이다.
#   그래서 `test/ci/refreshFailureAlerting.test.ts` 가 **목록 누락을 실패로 만든다.**
#
# ⚠ `workflow_run` 은 **기본 브랜치에 있는 파일만** 발동한다. 이 파일이 main 에 머지되기 전에는
#   브랜치에 올려도 아무 일도 일어나지 않는다(테스트하려면 머지 후 `workflow_dispatch`).
#
# ⚠ **이 알림 자신이 실패하면 알려 줄 것이 없다.** 자기를 감시 목록에 넣으면 실패가 자기를 다시
#   깨우는 되먹임이 되므로 일부러 넣지 않았다(`test/ci/refreshFailureAlerting.test.ts` 가 잠근다).
#   대신 여기서 하는 일을 **이슈 하나 열고 닫는 것**으로 묶어 뒀다 — 네트워크·빌드·의존성이 없어서
#   깨질 표면이 거의 없다. 감시자를 감시하는 층을 하나 더 쌓는 것보다 이쪽이 싸다.
on:
  workflow_run:
    # 이름은 각 파일의 `name:` 과 **정확히** 일치해야 한다(경로가 아니라 표시 이름으로 매칭한다).
    #
    # ⚠ 이 목록 **사이에 주석을 끼우지 마라.** 목록을 잠그는 테스트가 연속된 `- ` 줄만 읽어서
    #   (`refreshFailureAlerting.test.ts` 의 추출 정규식), 중간에 주석이 들어가면 그 아래 항목이
    #   통째로 안 보인다 — 감시 중이라고 적어 두고 실제로는 감시하지 않는 상태가 된다.
    #
    # `Main health check` 는 데이터 갱신이 아니라 **main 상시 점검**이다. 아무도 그 결과를
    # 기다리지 않으므로(사람이 보는 PR 화면에 뜨지 않는다) 이슈로 띄우지 않으면 조용히 빨간 채로
    # 남는다 — 그것이 정확히 그 워크플로가 막으려는 실패 모양이라, 여기 빠지면 자기모순이 된다.
    workflows:
      - Refresh dividend pay dates
      - Refresh ticker market data
      - Refresh dividend candidate universe
      - Refresh dividend lists
      - Refresh 13F snapshots
      - Refresh US market calendar
      - Refresh US congress stock trades
      - Refresh Korean assembly stock holdings
      - Check curated calendar horizon
      - Main health check
    types: [completed]

  # 실패를 기다리지 않고 알림 자체를 점검하기 위한 통로다. 진짜 파이프라인을 일부러 깨뜨리지 않고
  # 이슈 열기·중복 방지·복구 닫기를 그대로 돌려 볼 수 있다(연 다음 손으로 닫으면 된다).
  # "검증하지 않은 자동화는 자동화가 아니다" — 이 레포가 이번에 비싸게 배운 것이다.
  workflow_dispatch:
    inputs:
      workflow_name:
        description: '점검용: 실패했다고 가정할 워크플로 이름'
        required: true
        default: Refresh dividend pay dates
        type: string
      conclusion:
        description: '점검용: failure = 이슈를 연다 / success = 열려 있던 이슈를 닫는다'
        required: true
        default: failure
        type: choice
        options: [failure, success]

permissions:
  contents: read
  issues: write

# 같은 워크플로에 대한 알림이 겹쳐 돌면 "이미 열린 이슈가 있나" 확인과 생성 사이가 벌어져 이슈가
# 둘 열린다. 워크플로 이름으로 직렬화한다(서로 다른 파이프라인은 동시에 처리해도 무방하다).
concurrency:
  group: notify-refresh-failure-${{ github.event.workflow_run.name || inputs.workflow_name }}
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  # 🔴 `gh` 는 대상 저장소를 **git remote 로 알아낸다.** 이 잡은 코드가 필요 없어 `actions/checkout`
  #    을 하지 않으므로 러너에 `.git` 이 없고, 그러면 모든 gh 호출이 첫 줄에서
  #    `failed to run git: fatal: not a git repository` 로 죽는다(2026-08-12 실측 — 첫 실물 검증에서
  #    세 번 다 이 자리에서 실패했다). 체크아웃을 더하는 대신 저장소를 명시한다 — 이 워크플로가
  #    빠른 이유가 소스를 안 받는 것이라, 알림 하나 때문에 레포 전체를 받을 이유가 없다.
  GH_REPO: ${{ github.repository }}
  # dispatch 로 점검할 때는 workflow_run 컨텍스트가 비어 있으므로 입력값으로 떨어진다.
  WF_NAME: ${{ github.event.workflow_run.name || inputs.workflow_name }}
  CONCLUSION: ${{ github.event.workflow_run.conclusion || inputs.conclusion }}
  RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
  RUN_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch (점검)' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # `types: [completed]` 는 성공·실패·취소·건너뜀에 모두 뜬다. 여기서 셋으로 가른다.
      #   - failure / timed_out → 알린다. 타임아웃은 "느린 것"이 아니라 **끝내 못 끝낸 것**이라
      #     실패와 같이 다룬다(출처가 막히면 대개 타임아웃으로 나타난다).
      #   - success            → 열려 있던 알림 이슈를 닫는다.
      #   - cancelled/skipped  → 아무것도 하지 않는다. 사람이 껐거나 concurrency 가 걷어낸 것이지
      #                          고장이 아니다. 여기서 이슈를 열면 알림이 곧 무시당한다.
      - name: Classify the finished run
        id: classify
        run: |
          case "$CONCLUSION" in
            failure|timed_out) action=open ;;
            success)           action=close ;;
            *)                 action=ignore ;;
          esac
          echo "action=$action" >> "$GITHUB_OUTPUT"
          # 이슈 제목이 곧 식별자다 — 워크플로마다 하나만 열린다. 실패가 이어지면 새 이슈가 아니라
          # 그 이슈에 코멘트가 붙어, "지금 무엇이 깨져 있나"를 열린 이슈 목록이 그대로 말해 준다.
          echo "title=ci(alert): \"$WF_NAME\" 자동 갱신이 실패했다" >> "$GITHUB_OUTPUT"
          echo "$WF_NAME → $CONCLUSION → $action"

      # 🔴 `gh issue list --search` 를 쓰지 않는다. 검색 인덱스는 **뒤늦게 반영돼서**, 방금 연 이슈가
      #    잠시 검색에 안 잡힌다 — 연달아 실패하면 같은 이슈가 둘 열린다. 열린 이슈를 그대로 받아
      #    jq 로 **제목 완전일치**를 본다(제목은 env 로 넘겨 따옴표·특수문자에 안전하다).
      - name: Find the open alert issue for this workflow
        id: existing
        if: steps.classify.outputs.action != 'ignore'
        env:
          ALERT_TITLE: ${{ steps.classify.outputs.title }}
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.ALERT_TITLE)) | .[0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [ -n "$number" ]; then
            echo "이미 열린 알림 이슈가 있다: #$number"
          else
            echo "열린 알림 이슈가 없다."
          fi

      - name: Open the alert issue
        if: steps.classify.outputs.action == 'open' && steps.existing.outputs.number == ''
        env:
          ALERT_TITLE: ${{ steps.classify.outputs.title }}
        run: |
          {
            echo "**$WF_NAME** 워크플로가 실패했습니다. 이 파이프라인이 갱신하던 데이터는 **지금부터 낡기 시작합니다.**"
            echo
            echo "- 실패한 실행: $RUN_URL"
            echo "- 발동 계기: \`$RUN_EVENT\`"
            echo "- 감지 시각: $(date '+%Y-%m-%d %H:%M') KST"
            echo
            echo '### 왜 이 이슈가 필요한가'
            echo '화면에는 아무 증상이 없습니다 — 앱은 어제 데이터로 멀쩡히 그려집니다. 2026-08 에 두 파이프라인이 나흘간 멈춰 있었는데 아무도 몰랐고, 데이터 신선도를 우연히 훑어보다 발견했습니다.'
            echo
            echo '### 먼저 의심할 것 (전에 실제로 있었던 고장)'
            echo '- **러너에서만 막히는 출처** — 미국 러너에서 국회 사이트가 연결 타임아웃이었습니다(로컬은 정상). 처방은 싱가포르 함수 경유 릴레이(`/api/unfurl?relay=...`).'
            echo '- **타임존** — 워크플로 레벨 `TZ: Asia/Seoul` 이 빠지면 날짜 판정이 하루 어긋나 테스트 단계에서 멈춥니다. `vitest.config` 의 `env.TZ` 로는 부족합니다(V8 이 첫 `Date` 에 캐시).'
            echo '- **규칙이 자기 자신을 무효화** — 히든스타가 제외 집합에 자기 목록을 넣어 선정 0종이 됐습니다. "결과가 비면 쓰지 않는다" 가드 덕에 파일은 안 덮였지만 생성물이 멈춰 있었습니다.'
            echo '- **`api/*.js` 낡음** — 데이터를 커밋하면서 `npm run api:bundle` 을 안 돌리면 `api:check` 가 실패합니다.'
            echo '- **출처 개편·차단** — 위 넷이 아니면 대개 스크래핑 대상 HTML/API 가 바뀐 경우입니다. 실패 단계의 로그를 먼저 보세요.'
            echo
            echo '### 닫는 방법'
            echo '고친 뒤 그 워크플로를 다시 돌리면(`Run workflow`) **성공한 순간 이 이슈는 자동으로 닫힙니다.** 열려 있다는 것은 아직 깨져 있다는 뜻입니다 — 손으로 닫지 마세요.'
          } > issue-body.md
          gh issue create --title "$ALERT_TITLE" --body-file issue-body.md
          echo "::error::$WF_NAME 이 실패했다 — 알림 이슈를 열었다."

      # 같은 워크플로가 계속 실패하면 이슈를 늘리지 않고 코멘트만 붙인다. 매일 도는 파이프라인이
      # 일주일 깨져 있으면 이슈가 7개 쌓이고, 그러면 아무도 안 읽는다.
      - name: Comment on the existing alert issue
        if: steps.classify.outputs.action == 'open' && steps.existing.outputs.number != ''
        env:
          # 값은 우리가 부른 jq 가 돌려준 정수지만, 표현식을 셸 본문에 직접 심는 형태를 남기지 않는다
          # — 그 모양이 복사되면 다음번엔 사람이 준 문자열이 들어온다(`unfurl` 릴레이에서 배운 것).
          ISSUE: ${{ steps.existing.outputs.number }}
        run: |
          {
            echo "또 실패했습니다 — $(date '+%Y-%m-%d %H:%M') KST"
            echo
            echo "- 실행: $RUN_URL"
            echo "- 발동 계기: \`$RUN_EVENT\`"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
          echo "::error::$WF_NAME 이 여전히 실패한다 — #$ISSUE 에 기록했다."

      # 🔴 복구를 자동으로 닫는 것이 이 알림의 신뢰도를 만든다. 닫히지 않으면 "열린 이슈 = 지금
      #    깨져 있는 것"이라는 뜻이 사라지고, 사람이 매번 진위를 확인해야 해서 곧 안 읽게 된다.
      - name: Close the alert issue after a recovery
        if: steps.classify.outputs.action == 'close' && steps.existing.outputs.number != ''
        env:
          ISSUE: ${{ steps.existing.outputs.number }}
        run: |
          {
            echo "복구됐습니다 — **$WF_NAME** 이 다시 성공했습니다($(date '+%Y-%m-%d %H:%M') KST)."
            echo
            echo "- 성공한 실행: $RUN_URL"
          } > comment.md
          gh issue close "$ISSUE" --comment "$(cat comment.md)"
          echo "::notice::$WF_NAME 복구 — #$ISSUE 을 닫았다."
