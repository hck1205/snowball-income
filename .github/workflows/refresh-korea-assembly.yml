name: Refresh Korean assembly stock holdings

# 대한민국 국회의원 주식 보유(`shared/constants/koreaAssemblyStocks/`)를 갱신한다.
# 원자료는 국회공보의 「정기재산변동신고 공개목록」이고, 공개는 **1년에 딱 한 번**(3월 말)이다.
#
# ## 왜 "연 1회 크론"이 아니라 "3~6월 매일"인가
# 공개일이 해마다 다르다(2025-03-27 · 2026-03-26). 날짜를 못 박으면 하루만 어긋나도 그 해를 통째로
# 놓치고, 다음 해까지 낡은 자료가 남는다. 그래서 **3~6월에만 매일 목록을 확인**하고 나머지 8개월은
# 아예 돌지 않는다.
#
# 비용은 거의 0이다 — 수집기가 저장된 통권 호수(`issueNo`)와 목록을 비교해 **같으면 즉시 끝낸다**
# (HTTP 요청 1건). PDF(4MB·893쪽)를 받아 파싱하는 것은 새 호가 떴을 때 그 한 번뿐이다.
#
# ## 🔴 자동 머지하지 않는다
# 이 갱신은 1년에 한 번, 표 전체가 바뀌는 큰 변경이다(의원 300명·종목 600여 종). 가격 갱신처럼
# "매달 반드시 바뀌는 값"이 아니라 **사람이 봐야 하는 사건**이라, PR 만 열고 멈춘다.
# 배포 승인은 매번 사람이 한다([[ask-before-deploy]] — 티커 월간 갱신만 승인된 예외다).
on:
  schedule:
    # 3~9월 매일 21:00 UTC == 다음 날 06:00 KST. 다른 갱신 워크플로와 시각이 겹치지 않게 두었다.
    # 🔴 8월까지 여는 이유: 총선 다음 8월에 **신규·퇴직 의원 재산공개**가 따로 나온다
    # (제2020-98호 2020-08-28 · 제2024-107호 2024-08-29 — 4년 주기, 다음은 2028-08).
    # 3~6월만 보면 그 존재조차 모른 채 지나간다. 9월은 한 달 여유다.
    # ⚠ 수집기는 그 보충 공개를 **자동 반영하지 않는다**(전원이 아니라 몇 명짜리라 덮어쓰면 표가
    #   쪼그라든다). 발견하면 로그로 알리고, 반영 여부는 사람이 정한다.
    - cron: '0 21 * 3-9 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Gazette year to search (blank = current year)'
        required: false
        type: string
      check_only:
        description: 'Only report whether a new disclosure exists (writes nothing, opens no PR)'
        required: false
        default: false
        type: boolean

# 브랜치를 밀고 PR 을 연다. 머지는 하지 않는다(위 주석 참고).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-korea-assembly
  cancel-in-progress: false

env:
  # 🔴 Node **시작 전에** 심어야 하는 값이다(2026-08-11). V8 은 첫 Date 사용 시점에 타임존을
  #    캐시하므로, vitest.config 의 `env.TZ` 처럼 프로세스가 뜬 뒤 넣은 값은 Date/Intl 에 반영되지
  #    않는다. 그래서 `process.env.TZ` 는 'Asia/Seoul' 인데 `getHours()` 는 UTC 로 읽히는 상태가 됐고,
  #    이 잡이 2026-08-09 부터 테스트 단계에서 멈췄다(로컬은 PC 가 KST 라 우연히 통과했다).
  # ⚠ 이 앱의 날짜 계산(배당 지급일·'오늘' 판정)은 KST 기준이다 — 러너 기본값(UTC)으로 돌리면
  #   하루 어긋난 데이터를 그대로 커밋하게 된다.
  TZ: Asia/Seoul
  SNAPSHOT_JSON: shared/constants/koreaAssemblyStocks/koreaAssemblyStocks.generated.json
  # 🔴 **러너에서 국회 사이트가 열리지 않는다.** 로컬(한국)에서는 정상인데 GitHub Actions 에서는
  #    `Connection timed out` 으로 죽었다(2026-08-07 부터 매일 실패 — TZ 회귀와는 다른 원인이다).
  #    국가 차단이 아니라 그 경로에서만 막힌다: 우리 함수가 도는 싱가포르(sin1)에서는 200/1.6초로
  #    열린다(2026-08-12 실측). 그래서 러너 → 이 엔드포인트 → 국회 로 한 홉을 우회한다.
  # ⚠ 릴레이는 **호스트가 코드에 박혀 있고 경로가 둘로 제한된** 전용 통로다(오픈 프록시가 아니다) —
  #   근거와 가드는 `server/handlers/Unfurl/Unfurl.ts` 의 릴레이 머리말, 계약은 test/api/unfurl.test.ts.
  # ⚠ 로컬 수동 실행은 이 값을 주지 않아 **직접 접속**한다(릴레이가 죽어도 사람이 돌릴 수 있다).
  RELAY_BASE: https://hungry-hippo.xyz/api/unfurl

jobs:
  korea-assembly:
    runs-on: ubuntu-latest
    # 893쪽 PDF 파싱 + 타입체크 + 전체 테스트. 새 호가 없는 날은 1분 안에 끝난다.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🔴 이 레포에는 requirements 파일이 없다(파이썬 도구가 둘뿐이고 의존성이 이것 하나다).
      # 받는 것이 PDF 라서 pypdf 가 필요하다 — 버전을 열어 두면 파싱 결과가 조용히 달라질 수 있어
      # 메이저를 고정한다.
      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check 'pypdf>=5,<7'

      - name: Install dependencies
        run: npm ci

      # 입력은 셸에 보간하지 않고 env 로 넘긴다(수동 입력이 셸을 주입할 수 없게).
      #
      # 수집기의 종료 규칙:
      #   0 = 정상(새 호를 받아 썼거나, 새 호가 없어 그대로 두었거나)
      #   1 = 받았는데 집계가 0건 — 이때는 **덮어쓰지 않는다**(기존 스냅샷이 남는다)
      # 즉 "아직 공개 전"과 "파서가 죽었다"가 서로 다른 종료코드다. 3월 초에 매일 도는 이 크론에서
      # 전자는 정상 상황이라 실패로 만들면 안 된다.
      - name: Collect the disclosure
        env:
          YEAR: ${{ inputs.year }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          args="--relay $RELAY_BASE"
          if [ -n "$YEAR" ]; then args="$args --year=$YEAR"; fi
          if [ "$CHECK_ONLY" = "true" ]; then args="$args --check"; fi
          npm run korea:assembly -- $args

      # 🔴 **데이터가 바뀌면 `api/*.js` 도 낡는다**(2026-08-12 발견).
      # `api/*.js` 는 커밋되는 배포 산출물이고, 그중 `seo-html`·`og` 번들은 이 데이터를 **품고 있다**.
      # 데이터만 커밋하면 산출물이 소스와 어긋나 `api:check` 가 실패한다 — 실제로 지급일 갱신
      # PR(#127)이 머지된 직후 main 이 그 상태가 됐고, 다음 PR 의 CI 가 그것을 잡았다.
      # ⚠ 바뀐 것이 없으면 아무 파일도 변하지 않는다(멱등) — 조건 없이 돌려도 안전하다.
      - name: Rebundle api outputs
        run: npm run api:bundle

      - name: Typecheck
        # Full project (app + scripts + api). Bare `tsc -b` only covers the root (api + middleware).
        run: npx tsc -b tsconfig.build.json

      # NOTE: `test:ci` excludes test/snowball/SnowballApp.test.tsx (broken on main for unrelated
      # reasons). Everything else must pass, so a broken parser fails this gate and nothing ships.
      - name: Test
        run: npm run test:ci

      # 새 호가 없는 날(대부분의 날)은 여기서 조용히 끝난다 — 빈 커밋도 빈 PR 도 만들지 않는다.
      #
      # 🔴 브랜치를 **연도별로 나눈다**(`...-2026`). 브랜치 하나를 지웠다 다시 만들면, 아직 사람이
      # 보지 않은 지난해 PR 을 다음 해 실행이 지워 버린다(브랜치가 사라지면 GitHub 이 PR 을 닫는다).
      # 이 워크플로는 "사람이 보는 PR"이 정상 경로라서 그러면 안 된다.
      - name: Commit the refreshed snapshot
        id: commit
        if: inputs.check_only != true
        run: |
          git add "$SNAPSHOT_JSON" api
          if git diff --cached --quiet; then
            echo "바뀐 값이 없다 — 새 공개가 아직 없거나 같은 호다."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          year="$(node -p "require('./$SNAPSHOT_JSON').publishedAt.slice(0,4)")"
          branch="chore/refresh-korea-assembly-$year"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -B "$branch"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(data): 국회의원 정기재산변동신고 주식 보유를 갱신한다"
          git push --force origin "$branch"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # PR 은 열되 **머지하지 않는다.** 연 1회 대량 변경이라 사람이 본다.
      - name: Open the PR for review
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          {
            node -e '
              const s = require("./" + process.env.SNAPSHOT_JSON);
              const c = s.coverage;
              console.log(`국회공보 **${s.issueTitle}**(${s.publishedAt} 공개)에서 새 스냅샷을 만들었습니다.`);
              console.log("");
              console.log(`- 신고 기준일: **${s.asOfDate}** (공개는 이듬해 3월 말이라 볼 때는 이미 몇 달 지난 자료입니다)`);
              console.log(`- 의원 ${c.membersTotal}명 (공보 전체 ${c.peopleTotal}명 중 국회 사무처 고위공직자 제외)`);
              console.log(`- 상장주식을 신고한 의원 ${c.membersWithStocks}명 · 보유 ${c.holdings}건 · 종목 ${c.issuers}종`);
              console.log(`- 전량 매도(0주)라 보유에서 뺀 신고 ${c.fullySold}건`);
              console.log("");
              console.log("### 사람이 봐야 하는 이유");
              console.log("연 1회 갱신이라 표 전체가 한꺼번에 바뀝니다. 상위 종목이 상식적인지(대형주 위주인지),");
              console.log("종목명에 채권·펀드가 섞여 들어오지 않았는지 훑어봐 주세요 — 공보 서식이 바뀌면 파서가");
              console.log("조용히 다른 것을 긁어 옵니다.");
              console.log("");
              console.log("상위 10종목: " + s.topIssuers.slice(0, 10).map((r) => `${r.issuer}(${r.memberCount}명)`).join(", "));
            '
          } > pr-body.md
          title="chore(data): 국회의원 주식 보유 갱신 (연 1회 · 사람 확인 필요)"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file pr-body.md
          fi
          echo "::notice::PR 을 열었다. 🔴 자동 머지하지 않는다 — 사람이 확인하고 머지한다."
